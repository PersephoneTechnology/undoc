[package]
name = "undoc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
undoc = { path = ".." }
# The `ooxml` target writes the package around the fuzzed part; entries are stored, so no
# compressor is needed.
zip = { version = "9.0", default-features = false }

# Not a member of the library's workspace: built with `cargo fuzz` on nightly only.
[workspace]
members = ["."]

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ooxml"
path = "fuzz_targets/ooxml.rs"
test = false
doc = false
bench = false
