name: Fuzz

# An Office document parser reads untrusted input. The targets in fuzz/ run briefly when parser code
# changes on main, and longer every night; a crash or a timeout fails the job. libFuzzer
# prints the failing input in the log only when it is small (a few hundred bytes), so on
# failure the unit it wrote (fuzz/artifacts/<target>/) is kept for 7 days as an artifact --
# reproduce it with `cargo fuzz run <target> <file>`. The stack is symbolized when the runner
# has an llvm-symbolizer. Nothing is uploaded on success; nothing is published.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "fuzz/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [load, ooxml]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly — libFuzzer instrumentation)
        uses: dtolnay/rust-toolchain@nightly

      # The sanitizer runtime symbolizes a crash or timeout stack only with an llvm-symbolizer
      # it can find; without one the stack is bare addresses. Rust's llvm-tools component does
      # not ship it, so use the runner's (or apt's). Fuzzing runs either way.
      - name: Find llvm-symbolizer
        continue-on-error: true
        run: |
          s=$(ls /usr/bin/llvm-symbolizer* /usr/lib/llvm-*/bin/llvm-symbolizer 2>/dev/null | sort -V | tail -1)
          if [ -z "$s" ]; then
            sudo apt-get install -y --no-install-recommends llvm > /dev/null
            s=$(command -v llvm-symbolizer)
          fi
          echo "symbolizer: $s"
          echo "ASAN_SYMBOLIZER_PATH=$s" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/cargo-fuzz
            fuzz/target/
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked

      # The repository keeps no Office files (the tests assemble their packages), so the seeds
      # are written here: a minimal DOCX, XLSX and PPTX for `load`, and their main parts behind
      # the format byte for `ooxml`.
      - name: Seed the corpus
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          python3 - "${{ matrix.target }}" <<'PY'
          import sys, zipfile
          target = sys.argv[1]
          out = f"fuzz/corpus/{target}/"
          R = "http://schemas.openxmlformats.org/officeDocument/2006/relationships"
          parts = {
              "docx": ("word/document.xml", "wordprocessingml.document.main",
                       '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>a</w:t></w:r></w:p>'
                       '<w:tbl><w:tr><w:tc><w:p><w:r><w:t>b</w:t></w:r></w:p></w:tc></w:tr></w:tbl></w:body></w:document>'),
              "xlsx": ("xl/worksheets/sheet1.xml", None,
                       '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData><row r="1">'
                       '<c r="A1" t="inlineStr"><is><t>a</t></is></c><c r="B1"><v>1</v></c></row></sheetData></worksheet>'),
              "pptx": ("ppt/slides/slide1.xml", None,
                       '<p:sld xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">'
                       '<p:cSld><p:spTree><p:sp><p:txBody><a:p><a:r><a:t>a</a:t></a:r></a:p></p:txBody></p:sp></p:spTree></p:cSld></p:sld>'),
          }
          if target == "ooxml":
              for byte, kind in enumerate(["docx", "xlsx", "pptx"]):
                  open(out + kind, "wb").write(bytes([byte]) + parts[kind][2].encode())
              sys.exit()
          types = '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>{}</Types>'
          def rels(*links):
              body = "".join(f'<Relationship Id="rId{i + 1}" Type="{R}/{k}" Target="{t}"/>' for i, (k, t) in enumerate(links))
              return f'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">{body}</Relationships>'
          def override(part, kind):
              return f'<Override PartName="/{part}" ContentType="application/vnd.openxmlformats-officedocument.{kind}+xml"/>'
          packages = {
              "docx": {"[Content_Types].xml": types.format(override("word/document.xml", "wordprocessingml.document.main")),
                       "_rels/.rels": rels(("officeDocument", "word/document.xml")),
                       "word/document.xml": parts["docx"][2]},
              "xlsx": {"[Content_Types].xml": types.format(override("xl/workbook.xml", "spreadsheetml.sheet.main")),
                       "_rels/.rels": rels(("officeDocument", "xl/workbook.xml")),
                       "xl/workbook.xml": f'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="{R}"><sheets><sheet name="S" sheetId="1" r:id="rId1"/></sheets></workbook>',
                       "xl/_rels/workbook.xml.rels": rels(("worksheet", "worksheets/sheet1.xml")),
                       "xl/worksheets/sheet1.xml": parts["xlsx"][2]},
              "pptx": {"[Content_Types].xml": types.format(override("ppt/presentation.xml", "presentationml.presentation.main") + override("ppt/slides/slide1.xml", "presentationml.slide")),
                       "_rels/.rels": rels(("officeDocument", "ppt/presentation.xml")),
                       "ppt/_rels/presentation.xml.rels": rels(("slide", "slides/slide1.xml")),
                       "ppt/presentation.xml": f'<p:presentation xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:r="{R}"><p:sldIdLst><p:sldId id="256" r:id="rId1"/></p:sldIdLst></p:presentation>',
                       "ppt/slides/_rels/slide1.xml.rels": rels(),
                       "ppt/slides/slide1.xml": parts["pptx"][2]},
          }
          for kind, files in packages.items():
              with zipfile.ZipFile(out + kind, "w", zipfile.ZIP_DEFLATED) as z:
                  for name, body in files.items():
                      z.writestr(name, body)
          PY

      - name: Fuzz
        env:
          SECONDS_TO_RUN: ${{ github.event_name == 'schedule' && '1200' || '120' }}
        run: |
          cargo fuzz run "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_TO_RUN" -timeout=10 -rss_limit_mb=2048

      # The failing input is the finding: without it a timeout or crash cannot be reproduced.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 7
